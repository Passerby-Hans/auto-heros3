# auto-heros3 — dependency and environment definition (B0.1 refactor baseline).
#
# The versions below are the EXACT versions this project's .venv was validated with
# (2026-10-30: 25 offline suites / 744 checks). A refactor batch must not change runtime
# dependency versions; update this file deliberately and re-validate.
# uv.lock is the resolved full graph and is meant to be committed.
#
# Install / verify (never sync the live .venv while the MCP server is in use):
#   uv sync --frozen --python .venv\Scripts\python.exe
#   .venv\Scripts\python.exe -X utf8 tools\run_offline_suite.py
[project]
name = "auto-heros3"
version = "0.0.0"
description = "LLM agent that plays Heroes of Might and Magic III on VCMI (MCP server + engine bridge)"
requires-python = ">=3.14,<3.15"
license = "GPL-2.0-or-later"
